[project]
name = "karaoke-local"
version = "0.1.0"
description = "Karaoke local con UltraStar Deluxe, biblioteca y cola integrada"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-only"
dependencies = [
  "usdb-syncer @ git+https://github.com/bohning/usdb_syncer.git@1690c6d7505701047b245a3470867c0b3ddae01d",
  "more-itertools>=10,<12",
  "pillow>=13,<14",
  "requests>=2.32,<3",
  "mutagen>=1.47,<2",
  "numpy>=2,<3",
  "libtorrent==2.1.1",
  "ifaddr>=0.2,<1",
  "qrcode>=8,<9",
]

[project.scripts]
karaoke = "karaoke.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
