<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17171c">
  <meta name="color-scheme" content="dark">
  <title>Karaoke · Mando</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4m-4 0h8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 5h18M3 11h13M3 17h8m5-3 5 3-5 3z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16m5-16v16m5-15 5 14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19.5" cy="12" r="1" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="4"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-7 7 7-7 7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14m-7-7 7 7 7-7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 7h4m6 0h8M3 17h10m6 0h2"/><circle cx="10" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 17V6l11-2v11M9 9l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></symbol>
  </svg>
  <div class="shell">
    <header class="mast">
      <span class="wordmark"><svg aria-hidden="true"><use href="#i-mic"/></svg>Karaoke</span>
      <button id="settings-button" class="utility" aria-label="Ajustes de la sesión" title="Volumen y afinación" hidden><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
    </header>
    <main>
      <section id="closed-room" hidden>
        <h1>La sala se ha cerrado</h1>
        <p class="muted">Para volver a cantar, escanea el QR de la nueva sala en el ordenador.</p>
      </section>
      <section id="join" hidden>
        <h1>Unirse a la sesión</h1>
        <p class="muted">Elige el nombre que aparecerá en tus turnos.</p>
        <form id="join-form">
          <label for="name">Tu nombre</label>
          <input id="name" autocomplete="nickname" maxlength="32" placeholder="Nombre del cantante" required>
          <div id="manual-code"><label for="code">Código del ordenador</label>
            <input id="code" autocomplete="one-time-code" inputmode="numeric" placeholder="Código de sesión" maxlength="12">
          </div>
          <p id="join-error" role="alert" hidden></p>
          <button id="enter" class="primary" type="submit">Entrar en Karaoke</button>
        </form>
      </section>
      <p id="loading" class="muted" role="status">Conectando con Karaoke…</p>
      <div id="controller" hidden>
        <div id="connection" class="notice" role="status" hidden></div>
        <section id="transport" aria-label="Reproducción"></section>
        <section aria-labelledby="heading">
          <h1 id="heading">Buscar</h1>
          <form id="query-form" role="search">
            <label id="query-label" class="sr" for="query">Buscar canciones</label>
            <div class="search-field"><svg aria-hidden="true"><use href="#i-search"/></svg>
              <input id="query" type="search" autocomplete="off" enterkeyhint="search" placeholder="Artista, canción o enlace">
            </div>
          </form>
          <h2 id="list-heading" hidden></h2>
          <p class="muted" id="list-status" role="status"></p>
          <ul id="list" class="song-list"></ul>
          <div id="pagination" hidden><button id="prev">Anterior</button><button id="next">Más canciones</button></div>
        </section>
      </div>
    </main>
  </div>
  <nav id="nav" aria-label="Mando de karaoke" hidden>
    <div><button data-tab="search" aria-current="page"><svg aria-hidden="true"><use href="#i-search"/></svg>Buscar</button>
      <button data-tab="library"><svg aria-hidden="true"><use href="#i-library"/></svg>Biblioteca</button>
      <button data-tab="queue"><svg aria-hidden="true"><use href="#i-queue"/></svg><span>Cola <span id="queue-count"></span></span></button></div>
  </nav>
  <div id="feedback" role="status" aria-live="polite"></div>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="utility" aria-label="Cerrar"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div id="sheet-content"></div>
  </dialog>
</body></html>
