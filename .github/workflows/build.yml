name: Verify and stage release candidate
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Build and test run in this repository
        required: true
        type: string
      source_commit:
        description: Full 40-character candidate commit
        required: true
        type: string
      mode:
        description: Verify only or verify and upload to the existing matching draft
        required: true
        default: verify
        type: choice
        options: [verify, stage]
permissions:
  contents: read
  actions: read
concurrency:
  group: prepare-release-assets-${{ inputs.source_run }}-${{ inputs.source_commit }}
  cancel-in-progress: false
jobs:
  source:
    name: Wait for exact release CI
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Wait for a successful complete build
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          while true; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
            [[ $(jq -r '.head_sha' <<< "$run") == "$SOURCE_COMMIT" ]] || exit 1
            [[ $(jq -r '.path' <<< "$run") == .github/workflows/build.yml ]] || exit 1
            if [[ $(jq -r '.status' <<< "$run") == completed ]]; then
              jq -e '.conclusion == "success"' <<< "$run"
              break
            fi
            sleep 35
          done
  assets:
    needs: source
    name: ${{ matrix.arch }} release verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, artifact: karaoke-macos-latest}
          - {arch: x86_64, artifact: karaoke-macos-15-intel}
          - {arch: windows, artifact: karaoke-windows-x86_64}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHITECTURE: ${{ matrix.arch }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: candidate
          persist-credentials: false
      - name: Verify origin, target commit, workflow, platform and successful source run
        run: |
          opts=()
          if [[ "$MODE" == stage ]]; then opts+=(--stage); fi
          python3 tools/scripts/stage_mac_candidate.py --preflight --run "$SOURCE_RUN" --commit "$SOURCE_COMMIT" --arch "$ARCHITECTURE" --candidate candidate "${opts[@]}"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'windows'
        with:
          name: windows-desktop-smoke
          path: packages/smoke
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify files and optionally upload matching assets to existing draft
        run: |
          mkdir -p verification
          opts=()
          if [[ "$MODE" == stage ]]; then opts+=(--stage); fi
          if [[ "$ARCHITECTURE" == windows ]]; then
            package_sha=$(jq -er '.package_sha256' packages/smoke/result.json)
            python3 tools/scripts/stage_windows_release.py --input packages --output verification --run-id "$SOURCE_RUN" --commit "$SOURCE_COMMIT" --expected-zip-sha "$package_sha" "${opts[@]}"
          else
            python3 tools/scripts/stage_mac_candidate.py --run "$SOURCE_RUN" --commit "$SOURCE_COMMIT" --arch "$ARCHITECTURE" --candidate candidate --input packages --report verification/verification.json "${opts[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ matrix.arch }}
          path: verification/verification.json
          if-no-files-found: error
